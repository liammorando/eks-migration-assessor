apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eks-assessor

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  app.kubernetes.io/version: "0.1.0"
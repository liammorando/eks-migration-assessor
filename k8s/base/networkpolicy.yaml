apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eks-assessor
  namespace: eks-assessor
  labels:
    app.kubernetes.io/name: eks-assessor
    app.kubernetes.io/part-of: eks-assessor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: eks-assessor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8501
  egress:
    # Allow DNS resolution for git clone and external API calls
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS for git clone, API calls, and Ollama if enabled
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # Allow EKS Pod Identity agent (IMDS) for Pod Identity credentials
    # 169.254.170.23 is the link-local address for the EKS Pod Identity agent
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80

# NOTES:
# - Plain NetworkPolicy cannot filter by domain, so 443 egress is open to any destination.
# - kind's default CNI (kindnet) does not enforce NetworkPolicy.
# - On EKS, the VPC CNI needs network policy support enabled for these rules to be enforced.
# - The EKS Pod Identity agent runs at 169.254.170.23:80 and provides credentials
#   via the Pod Identity Webhook. Allow egress to this IP for Pod Identity to work.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eks-assessor

resources:
  - ../../base

# Patches for local overlay
patchesStrategicMerge:
  # Patch storage class to 'standard' (kind default)
  - patches/storageclass-standard.yaml
  # Local config: ensure MODEL_PROVIDER is none
  - patches/model-provider-none.yaml

labels:
  - pairs:
      environment: local
    includeSelectors: true
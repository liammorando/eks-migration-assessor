apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eks-assessor

resources:
  - ../../base
  - storageclass-gp3.yaml

# Patches for EKS overlay
patchesStrategicMerge:
  # Patch storage class to 'gp3' (EBS CSI driver)
  - patches/storageclass-gp3.yaml
  # EKS config: ensure MODEL_PROVIDER is none (no Ollama in cluster)
  - patches/model-provider-none.yaml
  # Add REPORTS_S3_BUCKET env (placeholder, Terraform will replace)
  - patches/reports-s3-bucket.yaml

# REMOVED: IRSA annotation (Pod Identity needs no annotation)

labels:
  - pairs:
      environment: eks
    includeSelectors: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  labels:
    app.kubernetes.io/name: eks-assessor
    app.kubernetes.io/part-of: eks-assessor
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
reclaimPolicy: Delete  # use Retain in production to preserve data on PVC deletion
# Note: EBS volumes are tied to a single AZ. The WaitForFirstConsumer binding mode
# ensures the volume is created in the same AZ as the pod that uses it.